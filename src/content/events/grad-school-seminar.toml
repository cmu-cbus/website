description = """
Thinking about grad school, or not sure if it’s right for you? The Comp Bio
Undergrad Society is hosting a Grad School Seminar, and we’d love to see you there!

Whether you’re working on applications right now or still deciding if you want to
apply in the future, join current PhD students and postdocs for an informal
conversation. They’ll talk honestly about their experiences, and the
conversation will be driven by your questions!

We’ll run it as a roundtable or Q&A depending on turnout. We’re expecting around
20 people, so the group will be small and relaxed. No preparation needed, but
feel free to bring questions!
"""

