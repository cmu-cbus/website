title = "Panel: The Future of Computational Biology in the Era of AI"
date = 2026-11-13
time = "2:45–3:30 PM"
location = "Tepper Simmons Auditorium B"

description = """
"The Future of Computational Biology in the Era of AI" is the closing panel of
CMU's AI4BIO Symposium, run together with CBUS. Speakers from CMU, Anthropic, MIT,
Berkeley and beyond will talk about how AI is changing biological discovery and
how students can prepare for the careers it is creating.

Please send us your questions. The panel opens with questions from CB undergrads,
and the organizers are building the conversation around what you send. This is
your chance to steer what some of the leading people in the field say about your
future, in front of the whole symposium.

Ask the thing you actually worry about. "Will AI make college obsolete?" is fair
game. The bolder the questions, the better the panel.

This event is in person only. You do not need to be registered for the symposium
to attend.
"""

rsvpNote = "Please get your questions in ASAP. Room is limited, so register soon."

